<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Planet X and SPHEREx brag</title>
<style>
    :root {
        --white: #f8fafc;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --amber: #fbbf24;
        --brand-red: #f43f5e;
        --brand-blue: #2563eb;
        --sans: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
        --mono: Consolas, ui-monospace, monospace;
    }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #05080f; }
    #stage {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        font-family: var(--sans); color: var(--white);
        /* The app's own viewport backdrop: dot grid over a deep-blue radial. */
        background:
            radial-gradient(circle, rgba(148, 163, 184, 0.12) 1px, transparent 1.4px),
            radial-gradient(ellipse at center, #10182a 0%, #0a101e 55%, #05080f 100%);
        background-size: 22px 22px, 100% 100%;
        background-position: center center, center center;
    }
    .layer { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }

    /* 1 Hook */
    #hookCanvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #hookVignette { position: absolute; inset: 0;
        background: radial-gradient(ellipse at center, rgba(5, 8, 15, 0.15) 0%, rgba(5, 8, 15, 0.55) 55%, rgba(5, 8, 15, 0.95) 100%); }
    #hookText { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
        font-size: 132px; font-weight: 700; letter-spacing: -0.02em; line-height: 1;
        text-shadow: 0 6px 40px rgba(0, 0, 0, 0.75); }
    #hookText .x { position: relative; display: inline-block; }
    #hookUnder { position: absolute; left: 0; right: 0; bottom: -18px; height: 8px; border-radius: 4px; background: var(--brand-red);
        transform-origin: left center; }

    /* 2 Reveal */
    #appWrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 50% 40%; }
    #appImg { width: 1920px; height: 1080px; border-radius: 16px; display: block;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(148, 163, 184, 0.35); }
    #revealShade { position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(5, 8, 15, 0) 38%, rgba(5, 8, 15, 0.82) 64%, rgba(5, 8, 15, 0.97) 100%); }
    #revealText { position: absolute; left: 120px; right: 120px; bottom: 96px; }

    .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
    .title { font-size: 92px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.02; margin-top: 10px; }
    .line { font-size: 44px; font-weight: 500; color: #e2e8f0; margin-top: 18px; letter-spacing: -0.005em; }
    .line b { color: var(--white); font-weight: 700; }

    /* 3-5 Feature scenes: text on the left, the real app on the right */
    #left { position: absolute; left: 104px; top: 0; bottom: 0; width: 540px; display: flex; flex-direction: column; justify-content: center; }
    .kicker { font: 700 20px var(--mono); letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; }
    .headline { font-size: 68px; font-weight: 700; line-height: 1.04; letter-spacing: -0.02em; margin-top: 18px; }
    .readout { margin-top: 40px; font: 700 42px var(--mono); color: var(--white); letter-spacing: 0.01em; white-space: nowrap; }
    .readout small { display: block; margin-top: 10px; font: 500 24px var(--mono); color: var(--muted); letter-spacing: 0.02em; }
    .chips { display: flex; gap: 10px; margin-top: 26px; }
    .chip { font: 700 20px var(--mono); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(148, 163, 184, 0.35);
        color: var(--muted); background: rgba(15, 23, 42, 0.7); }
    .chip.on { color: var(--white); border-color: rgba(96, 165, 250, 0.9); background: rgba(37, 99, 235, 0.35); }
    .chip.done { color: #cbd5e1; border-color: rgba(96, 165, 250, 0.45); }
    .ticks { display: flex; gap: 8px; margin-top: 26px; }
    .tick { width: 46px; height: 8px; border-radius: 4px; background: rgba(148, 163, 184, 0.25); }
    .tick.on { background: var(--brand-red); }
    .tick.done { background: rgba(96, 165, 250, 0.75); }

    #card { position: absolute; left: 680px; top: 40px; width: 1200px; height: 1000px; transform-origin: 50% 50%;
        border-radius: 18px; overflow: hidden; box-shadow: 0 40px 110px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(148, 163, 184, 0.35); }
    #cardCanvas { width: 1200px; height: 1000px; display: block; }

    #gizmoBox { position: absolute; left: 880px; top: 60px; width: 874px; height: 957px; }
    /* Fade the capture's rectangular edge into the stage background. */
    #gizmoCanvas { width: 874px; height: 957px; display: block;
        -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 86%, transparent 100%);
                mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 86%, transparent 100%); }

    /* 6 Outro */
    #outro { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    #outro .eyebrow { margin-top: 26px; }
    /* Space Apps rules: SI-generated video needs a visible watermark on every frame. */
    #siMark { position: absolute; right: 28px; bottom: 24px; z-index: 10; padding: 8px 14px; border-radius: 8px;
        background: rgba(5, 8, 15, 0.72); color: #f8fafc; font: 600 22px/1 system-ui, 'Segoe UI', sans-serif; letter-spacing: 0.04em; }
    #outro .title { font-size: 112px; }
    #punch { margin-top: 34px; font-size: 64px; font-weight: 700; letter-spacing: -0.01em; }
    #punch span { color: var(--brand-red); }
</style>
</head>
<body>
<div id="stage">
    <div class="layer" id="hook">
        <canvas id="hookCanvas" width="1920" height="1080"></canvas>
        <div id="hookVignette"></div>
        <div id="hookText">Is there a <span class="x">Planet X<span id="hookUnder"></span></span>?</div>
    </div>

    <div class="layer" id="reveal">
        <div id="appWrap"><img id="appImg" src="cap/app-wide.png" alt=""></div>
        <div id="revealShade"></div>
        <div id="revealText">
            <div class="eyebrow" id="rEyebrow">2026 NASA Space Apps Challenge</div>
            <div class="title" id="rTitle">Planet X and SPHEREx</div>
            <div class="line" id="rLine">Any spot in the sky. <b>Every SPHEREx image of it.</b></div>
        </div>
    </div>

    <div class="layer" id="card"><canvas id="cardCanvas" width="1714" height="1428"></canvas></div>
    <div class="layer" id="gizmoBox"><canvas id="gizmoCanvas" width="1360" height="1488"></canvas></div>

    <div class="layer" id="leftLayer">
        <div id="left">
            <div class="kicker" id="kicker"></div>
            <div class="headline" id="headline"></div>
            <div id="extra"></div>
        </div>
    </div>

    <div class="layer" id="outro">
        <div class="eyebrow" id="oEyebrow">2026 NASA Space Apps Challenge</div>
        <div class="title" id="oTitle">Planet X and SPHEREx</div>
        <div id="punch">Go find <span>Planet X.</span></div>
    </div>
    <div id="siMark">SI-generated video (Claude, Anthropic)</div>
</div>

<script>
// ---- Timeline (seconds). 120 BPM: a beat is 0.5 s; every cut is on a beat. ----
const FPS = 30, DURATION = 21
const CUT = { reveal: 3, time: 7, wave: 11, gizmo: 15, outro: 18 }

// Real values captured from the app (frame captions and the detector readout).
const FRAMES = [
    ['2025-04-29 00:24 UTC', '+0.0 days'], ['2025-05-03 23:21 UTC', '+5.0 days'], ['2025-05-03 23:23 UTC', '+5.0 days'],
    ['2025-05-22 17:29 UTC', '+23.7 days'], ['2025-10-26 07:38 UTC', '+180.3 days'], ['2025-10-28 00:17 UTC', '+182.0 days'],
    ['2025-11-01 08:38 UTC', '+186.3 days'], ['2025-11-01 08:40 UTC', '+186.3 days'],
]
const BANDS = [['D1', '0.754'], ['D2', '1.105'], ['D3', '1.629'], ['D4', '2.433'], ['D5', '3.826'], ['D6', '4.416']]

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const lerp = (a, b, k) => a + (b - a) * k
const easeOut = (k) => 1 - Math.pow(1 - clamp(k), 3)
const easeInOut = (k) => { k = clamp(k); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2 }
const easeIn = (k) => Math.pow(clamp(k), 3)
/** 0 -> 1 over [start, start + dur]. */
const prog = (t, start, dur) => clamp((t - start) / dur)
/** Fade/slide-in at `t0`, out at `t1` (seconds); returns {o, y}. */
function inOut(t, t0, t1, inDur = 0.4, outDur = 0.2, dy = 28)
{
    const i = easeOut(prog(t, t0, inDur)), o = 1 - easeIn(prog(t, t1 - outDur, outDur))
    return { o: Math.min(i, o), y: (1 - i) * dy - (1 - o) * dy * 0.4 }
}
const $ = (id) => document.getElementById(id)
const set = (el, o, transform = '') => { el.style.opacity = o.toFixed(4); el.style.transform = transform }

// ---- Images: everything decoded before the first frame. ----
const load = (src) => { const im = new Image(); im.src = src; return im.decode().then(() => im) }
const pad = (n, w) => String(n).padStart(w, '0')
let IMG = null
window.ready = (async () =>
{
    const [frames, bands, gizmo] = await Promise.all([
        Promise.all(FRAMES.map((_, i) => load(`cap/frames/f${pad(i, 2)}.png`))),
        Promise.all(BANDS.map(([d]) => load(`cap/bands/d${d.slice(1)}.png`))),
        Promise.all(Array.from({ length: 90 }, (_, i) => load(`cap/gizmo/g${pad(i, 3)}.png`))),
    ])
    await Promise.all([$('appImg').decode(), document.fonts.ready])
    IMG = { frames, bands, gizmo }
    return true
})()

const hookCtx = $('hookCanvas').getContext('2d'), cardCtx = $('cardCanvas').getContext('2d'), gizmoCtx = $('gizmoCanvas').getContext('2d')
let lastCard = null, lastGizmo = null

// Star square inside each 2x viewport capture (measured): x 698-1617, y 460-1379.
const SQ = { x: 698, y: 460, s: 920 }

function render(t)
{
    // ---------------- 1 Hook (0 - 3) ----------------
    const hookOn = t < CUT.reveal
    $('hook').style.opacity = hookOn ? (1 - easeIn(prog(t, CUT.reveal - 0.25, 0.25))).toFixed(4) : '0'
    if (hookOn)
    {
        // Lower-left of frame 1, clear of its no-data corner; slow push-in.
        const z = lerp(1, 1.14, easeInOut(t / CUT.reveal))
        const w = 600 / z, h = w * 9 / 16
        const cx = SQ.x + 330, cy = SQ.y + 590
        hookCtx.fillStyle = '#05080f'; hookCtx.fillRect(0, 0, 1920, 1080)
        hookCtx.globalAlpha = easeOut(prog(t, 0, 0.6))
        hookCtx.imageSmoothingQuality = 'high'
        hookCtx.drawImage(IMG.frames[0], cx - w / 2, cy - h / 2, w, h, 0, 0, 1920, 1080)
        hookCtx.globalAlpha = 1
        const a = inOut(t, 0.35, CUT.reveal - 0.05, 0.55, 0.3, 36)
        set($('hookText'), a.o, `translateY(calc(-50% + ${a.y}px))`)
        $('hookUnder').style.transform = `scaleX(${easeOut(prog(t, 0.95, 0.5)).toFixed(4)})`
    }

    // ---------------- 2 Reveal (3 - 7) ----------------
    const rOn = t >= CUT.reveal - 0.01 && t < CUT.time
    $('reveal').style.opacity = rOn ? (easeOut(prog(t, CUT.reveal, 0.35)) * (1 - easeIn(prog(t, CUT.time - 0.25, 0.25)))).toFixed(4) : '0'
    if (rOn)
    {
        const k = easeOut(prog(t, CUT.reveal, 0.9))
        const s = lerp(1.18, 0.9, k) - 0.02 * easeInOut(prog(t, CUT.reveal + 0.9, 3.1))
        $('appWrap').style.transform = `perspective(2200px) translateY(${lerp(60, -40, k)}px) rotateX(${lerp(14, 0, k)}deg) scale(${s})`
        const e = inOut(t, 3.45, CUT.time - 0.05, 0.4, 0.25)
        const ti = inOut(t, 3.55, CUT.time - 0.05, 0.45, 0.25)
        const li = inOut(t, 3.6, CUT.time - 0.05, 0.45, 0.25)
        set($('rEyebrow'), e.o, `translateY(${e.y}px)`)
        set($('rTitle'), ti.o, `translateY(${ti.y}px)`)
        set($('rLine'), li.o, `translateY(${li.y}px)`)
        $('revealShade').style.opacity = easeOut(prog(t, 3.3, 0.6)).toFixed(4)
    }

    // ---------------- 3 + 4 Card: time, then wavelength (7 - 15) ----------------
    const cOn = t >= CUT.time && t < CUT.gizmo
    if (cOn)
    {
        const enter = easeOut(prog(t, CUT.time, 0.5)), exit = easeIn(prog(t, CUT.gizmo - 0.25, 0.25))
        const drift = lerp(1, 1.025, easeInOut(prog(t, CUT.time, CUT.gizmo - CUT.time)))
        set($('card'), enter * (1 - exit), `translateX(${(1 - enter) * 80}px) scale(${(drift * (1 - 0.06 * exit)).toFixed(4)})`)
        let src
        if (t < CUT.wave) src = IMG.frames[Math.min(7, Math.floor((t - CUT.time) / 0.5))]
        else src = IMG.bands[Math.min(5, Math.floor((t - CUT.wave) / 0.5))]
        // Cropped in on the image, keeping the real gizmo (top right) and view-mode buttons in frame.
        if (src !== lastCard) { cardCtx.drawImage(src, 600, 60, 1714, 1428, 0, 0, 1714, 1428); lastCard = src }
    }
    else $('card').style.opacity = '0'

    // ---------------- 5 Gizmo (15 - 18) ----------------
    const gOn = t >= CUT.gizmo && t < CUT.outro
    if (gOn)
    {
        const enter = easeOut(prog(t, CUT.gizmo, 0.5)), exit = easeIn(prog(t, CUT.outro - 0.25, 0.25))
        set($('gizmoBox'), enter * (1 - exit), `scale(${(lerp(0.9, 1, enter) * (1 - 0.05 * exit)).toFixed(4)})`)
        const g = IMG.gizmo[Math.floor((t - CUT.gizmo) * FPS) % 90]
        if (g !== lastGizmo)
        {
            // Middle of the capture only: its left and right edges show bits of the viewport and toolbar.
            gizmoCtx.clearRect(0, 0, 1360, 1488)
            gizmoCtx.drawImage(g, 92, 0, 680, 744, 0, 0, 1360, 1488)
            lastGizmo = g
        }
    }
    else $('gizmoBox').style.opacity = '0'

    // ---------------- Left text for scenes 3 - 5 ----------------
    const lOn = t >= CUT.time && t < CUT.outro
    $('leftLayer').style.opacity = lOn ? '1' : '0'
    if (lOn)
    {
        let scene, t0, t1
        if (t < CUT.wave) { scene = 'time'; t0 = CUT.time; t1 = CUT.wave }
        else if (t < CUT.gizmo) { scene = 'wave'; t0 = CUT.wave; t1 = CUT.gizmo }
        else { scene = 'gizmo'; t0 = CUT.gizmo; t1 = CUT.outro }
        const kick = $('kicker'), head = $('headline'), extra = $('extra')
        $('left').style.width = scene === 'gizmo' ? '740px' : '540px'   // the globe sits further right than the card
        if (scene === 'time')
        {
            kick.textContent = '01 · Over time'
            head.innerHTML = 'Play every visit<br>like a movie.'
            const i = Math.min(7, Math.floor((t - CUT.time) / 0.5))
            extra.innerHTML = `<div class="readout">${FRAMES[i][0]}<small>Frame ${i + 1} of 8 · ${FRAMES[i][1]}</small></div>`
                + `<div class="ticks">${FRAMES.map((_, j) => `<div class="tick ${j === i ? 'on' : j < i ? 'done' : ''}"></div>`).join('')}</div>`
        }
        else if (scene === 'wave')
        {
            kick.textContent = '02 · Across wavelength'
            head.innerHTML = 'See it in every<br>infrared color.'
            const i = Math.min(5, Math.floor((t - CUT.wave) / 0.5))
            extra.innerHTML = `<div class="readout">${BANDS[i][1]} µm<small>Detector ${BANDS[i][0]} of 6 · 0.75–5 µm</small></div>`
                + `<div class="chips">${BANDS.map(([d], j) => `<div class="chip ${j === i ? 'on' : j < i ? 'done' : ''}">${d}</div>`).join('')}</div>`
        }
        else
        {
            kick.textContent = '03 · In 3D'
            head.innerHTML = 'Always know where<br>you’re looking.'
            extra.innerHTML = `<div class="readout" style="color: var(--amber)">+42° 26′ 37″<small style="color: var(--accent)">20h 18m 46s · seen over Earth</small></div>`
        }
        const k = inOut(t, t0 + 0.1, t1, 0.4, 0.22, 24)
        const h = inOut(t, t0 + 0.18, t1, 0.45, 0.22, 30)
        const x = inOut(t, t0 + 0.3, t1, 0.45, 0.22, 30)
        set(kick, k.o, `translateY(${k.y}px)`)
        set(head, h.o, `translateY(${h.y}px)`)
        set(extra, x.o, `translateY(${x.y}px)`)
    }

    // ---------------- 6 Outro (18 - 21) ----------------
    const oOn = t >= CUT.outro
    $('outro').style.opacity = oOn ? '1' : '0'
    if (oOn)
    {
        const e = easeOut(prog(t, CUT.outro + 0.25, 0.45)), ti = easeOut(prog(t, CUT.outro + 0.35, 0.5))
        const p = easeOut(prog(t, CUT.outro + 0.75, 0.5))
        set($('oEyebrow'), e, `translateY(${(1 - e) * 24}px)`)
        set($('oTitle'), ti, `translateY(${(1 - ti) * 30}px)`)
        set($('punch'), p, `translateY(${(1 - p) * 30}px)`)
    }
}
window.render = render
window.DURATION = DURATION
window.FPS = FPS
</script>
</body>
</html>
